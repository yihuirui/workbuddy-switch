# Reference-only demo build inherited from the mainline source.
name: build read-only demo artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    name: Build demo without publishing a site
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          cache: npm

      - name: Install dependencies and build demo
        run: |
          npm ci
          npm run build:demo

      - name: Upload demo files for review
        uses: actions/upload-artifact@v4
        with:
          name: workbuddy-switch2-read-only-demo
          path: dist/
          if-no-files-found: error
          retention-days: 7
