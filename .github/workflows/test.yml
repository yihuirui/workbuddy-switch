name: macOS ARM64 checks

# Source-snapshot validation only. This repository is a point-in-time export,
# not the development mainline; release builds live in the private mainline repo.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: TypeScript, Rust, and frontend tests (macOS ARM64)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.1
          cache: npm

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.99.1
          target: aarch64-apple-darwin
          components: rustfmt, clippy
          rustflags: ""

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend tests and build
        run: |
          npm test
          npm run build

      - name: Rust formatting and tests
        run: |
          rustfmt --check --edition 2021 \
            src-tauri/src/proxy_commands.rs \
            src-tauri/src/update_service.rs \
            crates/wb-switch-core/src/modules/update.rs
          cargo test -p wb-switch-core --locked
          cargo test -p wb-switch-server --locked

      - name: Clippy
        run: >-
          cargo clippy -p wb-switch-core -p wb-switch-server --all-targets --locked --no-deps --
          -D warnings
          -A clippy::items_after_test_module
          -A clippy::cloned_ref_to_slice_refs
