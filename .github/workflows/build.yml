# Inherited from the mainline source. This snapshot does not ship the pinned
# runtime binaries, so this workflow is kept for reference, not as a release path.
name: macOS preview builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v0.1.*-preview.*"

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    name: Build Workbuddy-Switch2 preview (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
            rust_target: aarch64-apple-darwin
          - architecture: x86_64
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      WB_RUNTIME_ARCH: ${{ matrix.architecture }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.10

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.99.1
          target: ${{ matrix.rust_target }}
          components: rustfmt, clippy
          rustflags: ""

      - name: Verify runner architecture
        run: |
          case "${{ matrix.architecture }}" in
            arm64) test "$(uname -m)" = arm64 ;;
            x86_64) test "$(uname -m)" = x86_64 ;;
          esac

      - name: Install frontend dependencies
        run: npm ci

      # A fresh source export contains no runtime binaries. Remove stale or
      # untracked files in this ephemeral runner before fetching the pinned set.
      - name: Prepare pinned runtime
        run: |
          rm -rf runtime
          mkdir -p runtime
          python3 scripts/fetch-proxy-runtime.py
          python3 scripts/build-patched-engine.py
          python3 scripts/update-runtime-manifest.py

      - name: Test frontend and Rust workspace
        run: |
          npm test
          npm run build
          cargo test -p wb-switch-rust --locked
          rustfmt --check --edition 2021 \
            src-tauri/src/proxy_commands.rs \
            src-tauri/src/update_service.rs \
            crates/wb-switch-core/src/modules/update.rs
          cargo test --workspace --locked
          cargo test -p wb-switch-core --test security_proxy --locked -- --ignored

      - name: Smoke-test runtime with an empty account store
        run: python3 scripts/smoke-proxy-runtime.py

      - name: Build desktop app
        run: npm run tauri -- build --target "${{ matrix.rust_target }}" --bundles app

      - name: Package and verify preview artifacts
        run: |
          python3 scripts/package-preview-macos.py \
            --app "target/${{ matrix.rust_target }}/release/bundle/macos/Workbuddy-Switch2.app" \
            --output-dir "release/${{ matrix.architecture }}" \
            --architecture "${{ matrix.architecture }}"

      - name: Upload preview workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Workbuddy-Switch2-0.1.5-macos-${{ matrix.architecture }}
          path: release/${{ matrix.architecture }}/
          if-no-files-found: error
          retention-days: 30
